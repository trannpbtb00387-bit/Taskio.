spring.application.name=Taskio
server.port=8080

# Update these values for your SQL Server instance before running the app.
spring.datasource.url=${TASKIO_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=Taskio;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${TASKIO_DB_USERNAME:sa}
spring.datasource.password=${TASKIO_DB_PASSWORD:12345}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# During development, JPA updates existing tables. The supplied SQL script can also create the schema.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
